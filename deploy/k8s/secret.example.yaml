# Szablon — NIE commituj prawdziwych wartości. Utwórz sekret np.:
#   kubectl -n sds create secret generic sds-app \
#     --from-literal=DATABASE_URL='postgresql://sds:HASLO@postgres.db.svc:5432/sds?schema=public&connection_limit=10' \
#     --from-literal=ADMIN_EMAIL='admin@twoja-domena.pl' \
#     --from-literal=ADMIN_PASSWORD='silne-haslo-startowe' \
#     --from-literal=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: sds-app
  namespace: sds
type: Opaque
stringData:
  DATABASE_URL: postgresql://sds:CHANGE-ME@postgres:5432/sds?schema=public&connection_limit=10
  # Konto administratora tworzone przez seed TYLKO, gdy w bazie nie ma żadnego użytkownika.
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: CHANGE-ME-min-10-chars
  # Wspólny klucz szyfrowania argumentów akcji serwerowych dla wszystkich replik (32 bajty, base64).
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: CHANGE-ME
