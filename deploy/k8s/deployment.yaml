apiVersion: apps/v1
kind: Deployment
metadata:
  name: sds-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      # Stan (sesje, blokady edycji) jest w bazie — repliki są bezstanowe,
      # sticky sessions nie są potrzebne.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: web
      initContainers:
        # Migracje przy każdym wdrożeniu — idempotentne i bezpieczne przy wielu replikach
        # (Prisma trzyma blokadę doradczą w PostgreSQL).
        - name: migrate
          image: sds-app
          command: ["migrate"]
          envFrom:
            - secretRef:
                name: sds-app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: web
          image: sds-app
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sds-app
            - secretRef:
                name: sds-app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /api/health?ready=1, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # Daj Traefikowi czas na wypięcie poda z puli przed zatrzymaniem.
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
