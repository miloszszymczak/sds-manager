# Dane startowe: słowniki, administrator, substancje/mieszaniny/produkty z arkusza,
# karty D-76. Idempotentny (tworzy tylko brakujące rekordy) — można go uruchamiać ponownie:
#   kubectl -n sds delete job sds-seed --ignore-not-found && kubectl apply -k deploy/k8s
apiVersion: batch/v1
kind: Job
metadata:
  name: sds-seed
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed potrzebuje schematu — na świeżej instalacji Job może wystartować przed podami aplikacji.
        - name: migrate
          image: sds-app
          command: ["migrate"]
          envFrom:
            - secretRef: { name: sds-app }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: seed
          image: sds-app
          command: ["node", "dist/seed.cjs"]
          envFrom:
            - secretRef: { name: sds-app }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
